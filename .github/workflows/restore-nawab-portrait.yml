name: Restore and upscale Nawab Sahib portrait
on:
  push:
    paths:
      - '.github/workflows/restore-nawab-portrait.yml'
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upscale portrait with high-quality resampling
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          src = 'bahawal-digital-news/public/images/nawab-sahib-transparent.png'
          dst = 'bahawal-digital-news/public/images/nawab-sahib-upscaled-2x.png'
          im = Image.open(src).convert('RGBA')
          w, h = im.size
          rgb = im.convert('RGB').resize((w * 2, h * 2), Image.Resampling.LANCZOS)
          rgb = ImageEnhance.Contrast(rgb).enhance(1.025)
          rgb = rgb.filter(ImageFilter.UnsharpMask(radius=1.5, percent=115, threshold=3))
          alpha = im.getchannel('A').resize((w * 2, h * 2), Image.Resampling.LANCZOS)
          rgb.putalpha(alpha)
          rgb.save(dst, format='PNG', optimize=True)
          print(f'Created {dst}: {w*2}x{h*2}')
          PY
      - name: Commit enhanced image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bahawal-digital-news/public/images/nawab-sahib-upscaled-2x.png
          git commit -m 'Add 2x restored Nawab Sahib portrait' || echo 'No changes to commit'
          git push